name: Check and publish offline maps

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: Region to check
        type: choice
        required: true
        default: us-ia
        options:
          - us-ia
          - us-wi
      dry_run:
        description: Check and build without publishing
        type: boolean
        required: true
        default: true
      allow_count_anomaly:
        description: Allow an explained road or speed-limit count drop
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: map-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule' || vars.MAP_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(github.event_name == 'schedule' && '["us-ia","us-wi"]' || format('["{0}"]', inputs.region || 'us-ia')) }}
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned map build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run the full Python test suite
        run: python -m unittest discover -s tests -v

      - name: Check and publish ${{ matrix.region }} map data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAP_PUBLICATION_ENABLED: ${{ vars.MAP_PUBLICATION_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REGION: ${{ matrix.region }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_COUNT_ANOMALY: ${{ inputs.allow_count_anomaly }}
          RUN_SUMMARY: publication-result.json
        shell: bash
        run: |
          set -euo pipefail
          args=(--region "$INPUT_REGION" --summary "$RUN_SUMMARY")
          publish=false
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            [[ "$MAP_PUBLICATION_ENABLED" == "true" ]] && publish=true
          elif [[ "$MAP_PUBLICATION_ENABLED" == "true" && "$INPUT_DRY_RUN" == "false" ]]; then
            publish=true
          fi
          if [[ "$publish" == "true" ]]; then
            args+=(--publish)
          else
            args+=(--dry-run)
          fi
          if [[ "$INPUT_ALLOW_COUNT_ANOMALY" == "true" ]]; then
            args+=(--allow-count-anomaly)
          fi
          /usr/bin/time -v -o resource-usage.txt python scripts/publish_maps.py "${args[@]}"
          cat resource-usage.txt

      - name: Add run details to summary
        run: |
          {
            echo "### ${{ matrix.region }} map publication check"
            echo
            cat publication-result.json
            echo
            echo '### Runner resource usage'
            echo '```text'
            cat resource-usage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit successful check status
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          MAP_PUBLICATION_ENABLED: ${{ vars.MAP_PUBLICATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          # Apply this region's result after syncing the branch's latest status.
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          from publication_status import update_status
          report = json.loads(pathlib.Path('publication-result.json').read_text())
          path = pathlib.Path('publication-status.json')
          status = json.loads(path.read_text()) if path.exists() else {}
          if os.environ['EVENT_NAME'] == 'schedule':
              dry_run = os.environ.get('MAP_PUBLICATION_ENABLED') != 'true'
          else:
              dry_run = (os.environ.get('MAP_PUBLICATION_ENABLED') != 'true'
                         or os.environ.get('INPUT_DRY_RUN') != 'false')
          path.write_text(json.dumps(update_status(status, report, dry_run=dry_run), indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful map source check"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
